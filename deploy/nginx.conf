# Cấu hình Nginx cho SOLTERRA trên Alibaba Cloud ECS (vùng Hong Kong).
#
# Cài đặt:
#   1. Chép nội dung out/ lên máy chủ:  rsync -av --delete out/ user@host:/var/www/solterra/
#   2. Đặt file này vào /etc/nginx/conf.d/solterra.conf
#   3. Đổi solterravn.com thành domain thật nếu khác
#   4. nginx -t && systemctl reload nginx
#   5. Cấp SSL:  certbot --nginx -d solterravn.com -d www.solterravn.com
#
# Nhớ mở cổng 80 và 443 trong Security Group của ECS — đây là chỗ hay quên nhất,
# Nginx chạy đúng nhưng bên ngoài vẫn không vào được.

server {
    listen 80;
    listen [::]:80;
    server_name solterravn.com www.solterravn.com;

    root /var/www/solterra;
    index index.html;

    # Nén: quan trọng với người dùng ở Trung Quốc đại lục, vì lưu lượng sang
    # Hong Kong đi qua ranh giới kiểm duyệt nên băng thông thực tế hay bị bóp.
    # Brotli nén tốt hơn gzip ~15% nhưng cần module ngx_brotli; nếu chưa có thì
    # riêng gzip cũng đã đủ dùng.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css application/javascript application/json image/svg+xml;

    # Gốc site chuyển sang bản tiếng Trung.
    # Khi thêm ngôn ngữ khác, có thể chuyển hướng theo $http_accept_language.
    location = / {
        return 302 /zh/;
    }

    # Tài nguyên build có mã băm trong tên file nên cache vĩnh viễn được.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Ảnh và font: cache dài nhưng vẫn cho phép thay thế khi cần.
    location ~* \.(webp|png|jpe?g|svg|ico|woff2)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # HTML không cache, để lần deploy sau khách thấy ngay bản mới.
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Static export sinh ra thư mục kèm index.html (do trailingSlash: true).
    location / {
        try_files $uri $uri/ $uri.html /404.html;
    }

    error_page 404 /404.html;

    # Vài header bảo mật cơ bản.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
